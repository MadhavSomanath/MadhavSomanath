    .sub { fill: #8B949E; font: 400 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .a1, .a2, .a3, .a4 { opacity: 0; animation: up .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .a1 { animation-delay: .1s } .a2 { animation-delay: .35s } .a3 { animation-delay: .6s } .a4 { animation-delay: .85s }
    .pulse { animation: pu 4s ease-in-out infinite; transform-origin: 940px 190px; }
    @keyframes pu { 0%,100% { transform: scale(1); opacity: .8 } 50% { transform: scale(1.25); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .a1,.a2,.a3,.a4 { opacity: 1 } }
  </style>

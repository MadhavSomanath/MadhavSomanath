<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-label="How I work">
  <style>
    .num { fill: #768390; font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3px; }
    .t { fill: #FF5A1F; font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -.8px; }
    .ring { stroke: #FF5A1F; }
    .ln { stroke: #768390; stroke-opacity: .6; stroke-dasharray: 3 8; }
    .sp { fill: #768390; animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .8 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g transform="translate(34 42)">
    <ellipse class="ring" rx="24" ry="10" fill="none" stroke-width="1.3" stroke-opacity=".45" transform="rotate(-20)"/>
    <circle r="7" fill="#FF5A1F"/>
    <circle r="3" fill="#79C0FF"><animateMotion dur="4s" repeatCount="indefinite" path="M-24 0a24 10 0 1 0 48 0a24 10 0 1 0 -48 0" transform="rotate(-20)"/></circle>
  </g>
  <g>
    <animate attributeName="opacity" values="0;1" dur=".9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="-12 0;0 0" dur=".9s" fill="freeze" calcMode="spline" keySplines=".2 .7 .2 1"/>
    <text class="num" x="76" y="50">01</text>
    <text class="t" x="112" y="54">How I work</text>
  </g>
  <line class="ln" x1="390" y1="42" x2="1190" y2="42" stroke-width="1.5"><animate attributeName="x2" from="390" to="1190" dur="1.6s" begin=".3s" fill="freeze"/></line>
  <circle class="sp" cx="522" cy="56" r="1" style="animation-delay:-1.0s"/><circle class="sp" cx="797" cy="40" r="1.8" style="animation-delay:-1.5s"/><circle class="sp" cx="580" cy="42" r="1.4" style="animation-delay:-1.7s"/><circle class="sp" cx="999" cy="22" r="1.4" style="animation-delay:-1.1s"/><circle class="sp" cx="1029" cy="46" r="1" style="animation-delay:-3.6s"/><circle class="sp" cx="443" cy="23" r="1.8" style="animation-delay:-0.0s"/><circle class="sp" cx="1090" cy="49" r="1.4" style="animation-delay:-2.9s"/><circle class="sp" cx="821" cy="53" r="1.4" style="animation-delay:-2.2s"/><circle class="sp" cx="683" cy="49" r="1.4" style="animation-delay:-3.8s"/><circle class="sp" cx="1124" cy="39" r="1.8" style="animation-delay:-3.7s"/>
</svg>

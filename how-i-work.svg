  <path d="M150 110C300 60 300 60 450 110S600 160 750 110 900 60 1050 110" fill="none" stroke="#30363D" stroke-width="1.5" stroke-dasharray="3 7"/>
  <g>
      <circle cx="150" cy="110" r="22" fill="#0B0F1E" stroke="#30363D" stroke-width="1.5"/>
      <circle class="lit" cx="150" cy="110" r="22" fill="none" stroke="#FF5A1F" stroke-width="2" style="animation-delay:0s"/>
      <circle cx="150" cy="110" r="6" fill="#FF5A1F"/>
      <text class="num" x="150" y="66" text-anchor="middle">01</text>
      <text class="t" x="150" y="178" text-anchor="middle">Talk to users</text>
      <text class="d" x="150" y="208" text-anchor="middle">Start from the problem,</text>
      <text class="d" x="150" y="232" text-anchor="middle">not the model.</text>
    </g><g>
      <circle cx="450" cy="110" r="22" fill="#0B0F1E" stroke="#30363D" stroke-width="1.5"/>
      <circle class="lit" cx="450" cy="110" r="22" fill="none" stroke="#FF5A1F" stroke-width="2" style="animation-delay:2s"/>
      <circle cx="450" cy="110" r="6" fill="#FF5A1F"/>
      <text class="num" x="450" y="66" text-anchor="middle">02</text>
      <text class="t" x="450" y="178" text-anchor="middle">Prototype fast</text>
      <text class="d" x="450" y="208" text-anchor="middle">Real screens and real code</text>
      <text class="d" x="450" y="232" text-anchor="middle">in days, not decks.</text>
    </g><g>
      <circle cx="750" cy="110" r="22" fill="#0B0F1E" stroke="#30363D" stroke-width="1.5"/>
      <circle class="lit" cx="750" cy="110" r="22" fill="none" stroke="#FF5A1F" stroke-width="2" style="animation-delay:4s"/>
      <circle cx="750" cy="110" r="6" fill="#FF5A1F"/>
      <text class="num" x="750" y="66" text-anchor="middle">03</text>
      <text class="t" x="750" y="178" text-anchor="middle">Measure trust</text>
      <text class="d" x="750" y="208" text-anchor="middle">Evals, metrics and guardrails</text>
      <text class="d" x="750" y="232" text-anchor="middle">before anything ships.</text>

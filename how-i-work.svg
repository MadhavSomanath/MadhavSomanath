<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="How I work: 1. Talk to users. 2. Prototype fast. 3. Measure trust. 4. Ship and learn.">
  <style>
    .st { fill: #E6EDF3; animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
    @keyframes up { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .st { opacity: .5 } }
    .num { fill: #768390; font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3px; }
    .t { fill: #F0F3F6; font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .d { fill: #8B949E; font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .lit { opacity: 0; animation: lit 6s ease-out infinite; }
    @keyframes lit { 0% { opacity: 1 } 30% { opacity: 0 } 100% { opacity: 0 } }
  </style>
  <defs>

      <stop offset="0" stop-color="#FFB08A"/><stop offset=".5" stop-color="#FF5A1F"/><stop offset="1" stop-color="#B8350C"/>
    </radialGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#FF5A1F" stop-opacity=".45"/><stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/></radialGradient>
  </defs>

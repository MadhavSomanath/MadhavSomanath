<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-label="Get in touch">
  <style>
    .num { fill: #768390; font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3px; }
    .t { fill: #FF5A1F; font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -.8px; }
    .ring { stroke: #FF5A1F; }
    .ln { stroke: #768390; stroke-opacity: .6; stroke-dasharray: 3 8; }
    .sp { fill: #768390; animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .8 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g transform="translate(34 42)">
    <ellipse class="ring" rx="24" ry="10" fill="none" stroke-width="1.3" stroke-opacity=".45" transform="rotate(-20)"/>
    <circle r="7" fill="#FF5A1F"/>
    <circle r="3" fill="#79C0FF"><animateMotion dur="4s" repeatCount="indefinite" path="M-24 0a24 10 0 1 0 48 0a24 10 0 1 0 -48 0" transform="rotate(-20)"/></circle>
  </g>
  <g>
    <animate attributeName="opacity" values="0;1" dur=".9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="-12 0;0 0" dur=".9s" fill="freeze" calcMode="spline" keySplines=".2 .7 .2 1"/>
    <text class="num" x="76" y="50">03</text>
    <text class="t" x="112" y="54">Get in touch</text>
  </g>
  <line class="ln" x1="434" y1="42" x2="1190" y2="42" stroke-width="1.5"><animate attributeName="x2" from="434" to="1190" dur="1.6s" begin=".3s" fill="freeze"/></line>
  <circle class="sp" cx="634" cy="44" r="1.4" style="animation-delay:-3.7s"/><circle class="sp" cx="803" cy="45" r="1.8" style="animation-delay:-0.1s"/><circle class="sp" cx="1064" cy="32" r="1" style="animation-delay:-0.8s"/><circle class="sp" cx="977" cy="44" r="1.8" style="animation-delay:-1.9s"/><circle class="sp" cx="922" cy="28" r="1.8" style="animation-delay:-0.6s"/><circle class="sp" cx="1127" cy="38" r="1" style="animation-delay:-2.7s"/><circle class="sp" cx="510" cy="52" r="1.8" style="animation-delay:-0.2s"/><circle class="sp" cx="1023" cy="55" r="1.4" style="animation-delay:-1.9s"/><circle class="sp" cx="979" cy="57" r="1.8" style="animation-delay:-3.2s"/><circle class="sp" cx="770" cy="51" r="1.8" style="animation-delay:-1.8s"/>
</svg>
